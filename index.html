<h1>投稿ツール</h1>
<p>「投稿ツール」は、運営者自身が管理するYouTubeチャンネルに動画を投稿するための個人用ツールです。一般向けには提供していません。</p>
<p>YouTubeへの動画アップロードと、投稿先チャンネルの確認（チャンネルIDの読み取り）にのみ、Googleアカウントの権限を使います。</p>
<p>本ツールは YouTube API Services を使用しています。利用にあたっては <a href="https://www.youtube.com/t/terms">YouTube 利用規約</a>が適用されます。Google のプライバシーの取り扱いは <a href="https://policies.google.com/privacy">Google プライバシー ポリシー</a>をご覧ください。</p>
